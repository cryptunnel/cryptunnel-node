# One-off: a brand-new npm package cannot be created through trusted publishing, so the very first
# release goes out with a granular access token kept in the NPM_TOKEN repository secret. Delete this
# workflow and the secret once the package exists and publish.yml (OIDC) takes over.
name: First publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
